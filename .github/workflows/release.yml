name: release

# One rolling release per channel: a push to `main` publishes `latest`, a push to `next` publishes the `preview` prerelease (a tag may not share the branch's name). Each holds
# Coop.zip (the whole package, for first installs), launcher.zip, mod-<id>.zip per game and manifest.json (SHA-256 and size of every
# asset and file; tools/release_manifest.py). Installed launchers read the manifest and download only the components that changed.
# Each component has its own version. A component whose inputs (tools/release_inputs.py) are the same as in the channel's current
# release ships that release's zip again, byte for byte, with its version; the other components get the previous version + 1.
# Friends install once from https://github.com/<repo>/releases/download/<channel>/Coop.zip.
on:
  push:
    branches: [main, next]

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

env:
  CHANNEL: ${{ github.ref_name == 'main' && 'latest' || 'preview' }}

jobs:
  package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Publish check
        run: python tools/publish_check.py

      - name: Release manifest test
        run: |
          python tools/release_manifest_test.py
          python tools/release_inputs_test.py

      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x86

      - name: Build RE0 adapter
        shell: pwsh
        working-directory: adapters/re0
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build
          Get-ChildItem build/*_test.exe -Exclude net_test.exe | ForEach-Object { & $_.FullName; if ($LASTEXITCODE -ne 0) { throw "$($_.Name) failed" } }

      - name: Build SR2 adapter
        shell: pwsh
        working-directory: adapters/sr2
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build
          Get-ChildItem build/*_test.exe | ForEach-Object { & $_.FullName; if ($LASTEXITCODE -ne 0) { throw "$($_.Name) failed" } }

      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Build DS2 adapter
        shell: pwsh
        working-directory: adapters/ds2
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build
          Get-ChildItem build/*_test.exe -Exclude net_test.exe | ForEach-Object { & $_.FullName; if ($LASTEXITCODE -ne 0) { throw "$($_.Name) failed" } }

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Launcher end-to-end tests
        shell: pwsh
        run: |
          dotnet build launcher/CoopLauncher.csproj -c Release -o launcher/bin/Release/net8.0-windows
          python tools/save_sync_test.py
          if ($LASTEXITCODE -ne 0) { throw "save_sync_test failed" }
          python tools/diagnostics_test.py
          if ($LASTEXITCODE -ne 0) { throw "diagnostics_test failed" }

      - name: Fetch current release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The channel's current manifest and component zips, read before the publish step replaces the release. No release, or one
          # without a manifest, means every component is new; any other failure stops the run (versions must never restart).
          $assets = gh release view $env:CHANNEL --json assets --jq '.assets[].name' 2>&1
          if ($LASTEXITCODE -ne 0) {
            if ("$assets" -match 'release not found') { Write-Host "No $env:CHANNEL release yet: every component is new"; exit 0 }
            throw "could not read the $env:CHANNEL release: $assets"
          }
          if ($assets -notcontains 'manifest.json') { Write-Host "The $env:CHANNEL release has no manifest: every component is new"; exit 0 }
          gh release download $env:CHANNEL --dir previous --pattern manifest.json --pattern launcher.zip --pattern 'mod-*.zip'
          if ($LASTEXITCODE -ne 0) { throw "could not download the $env:CHANNEL release" }

      - name: Assemble package
        shell: pwsh
        run: |
          # The SR2 mission scripts are not shipped: the launcher generates them on the player's PC from this delta.
          if (-not (Test-Path adapters/sr2/scripts.delta.json)) { throw "adapters/sr2/scripts.delta.json is missing (rebuild.cmd in adapters/sr2 writes it)" }
          dotnet publish launcher/CoopLauncher.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:DebugType=none -o pkg/launcher/app
          New-Item -ItemType Directory -Force pkg/launcher/games, pkg/adapters/re0, pkg/adapters/sr2, pkg/adapters/ds2 | Out-Null
          Copy-Item launcher/games/*.json pkg/launcher/games/
          Copy-Item adapters/re0/dinput8.dll pkg/adapters/re0/
          Copy-Item adapters/sr2/dinput8.dll pkg/adapters/sr2/
          Copy-Item adapters/sr2/scripts.delta.json pkg/adapters/sr2/
          Copy-Item adapters/ds2/version.dll pkg/adapters/ds2/
          Copy-Item launcher/package/README.txt pkg/
          $legacy = if ($env:CHANNEL -eq 'latest') { @('--legacy-zip', 'RE0-Coop.zip') } else { @() }
          python tools/release_inputs.py $env:GITHUB_SHA fingerprints.json
          if ($LASTEXITCODE -ne 0) { throw "release_inputs failed" }
          $previous = if (Test-Path previous/manifest.json) { @('--previous', 'previous') } else { @() }
          python tools/release_manifest.py pkg release --repo "${{ github.repository }}" --channel $env:CHANNEL --build $env:GITHUB_RUN_NUMBER --commit $env:GITHUB_SHA --fingerprints fingerprints.json @previous @legacy
          if ($LASTEXITCODE -ne 0) { throw "release_manifest failed" }

      - name: Publish rolling release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = $env:CHANNEL
          $firstInstall = "https://github.com/${{ github.repository }}/releases/download/$tag/Coop.zip"
          $notes = "Automated build $env:GITHUB_RUN_NUMBER of $env:GITHUB_SHA on $env:GITHUB_REF_NAME. First install: unzip $firstInstall anywhere and run launcher\app\coop-launcher.exe; it updates itself from then on."
          [string[]]$flags = if ($tag -eq 'latest') { @() } else { @('--prerelease') }
          $assets = Get-ChildItem release -File | Where-Object { $_.Name -ne 'manifest.json' } | ForEach-Object { $_.FullName }

          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release delete $tag --cleanup-tag --yes
            if ($LASTEXITCODE -ne 0) { throw "could not delete the old $tag release" }
          }
          gh release create $tag @assets --target $env:GITHUB_SHA --title "Build $env:GITHUB_RUN_NUMBER" --notes $notes @flags
          if ($LASTEXITCODE -ne 0) { throw "could not create the $tag release" }
          # The manifest goes last, so a launcher that sees it finds every asset it names.
          gh release upload $tag release/manifest.json
          if ($LASTEXITCODE -ne 0) { throw "could not upload the manifest" }
