name: release

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Publish check
        run: python tools/publish_check.py

      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x86

      - name: Build adapter
        shell: pwsh
        working-directory: adapters/re0
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build --target re0_adapter

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Assemble package
        shell: pwsh
        run: |
          dotnet publish launcher/CoopLauncher.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:DebugType=none -o pkg/launcher/app
          New-Item -ItemType Directory -Force pkg/launcher/games, pkg/adapters/re0 | Out-Null
          Copy-Item launcher/games/re0.json pkg/launcher/games/
          Copy-Item adapters/re0/dinput8.dll pkg/adapters/re0/
          Copy-Item launcher/package/README.txt pkg/
          Set-Content -NoNewline -Path pkg/launcher/app/version.txt -Value $env:GITHUB_RUN_NUMBER
          Set-Content -Path pkg/launcher/app/update.json -Value '{ "repo": "${{ github.repository }}" }'
          Compress-Archive -Path pkg/* -DestinationPath RE0-Coop.zip

      - name: Publish rolling release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --cleanup-tag --yes
          gh release create latest RE0-Coop.zip --target $env:GITHUB_SHA --title "Build $env:GITHUB_RUN_NUMBER" --notes "Automated build $env:GITHUB_RUN_NUMBER of $env:GITHUB_SHA"
